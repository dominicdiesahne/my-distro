# Podman on my-distro (package my-podman-conf): there is no systemd, so
# control groups are made directly in /sys/fs/cgroup (cgroupfs; rootless
# containers can't set limits like --memory, they run without), and events
# and container logs go into files. crun runs the containers (runc is
# Docker's). The live system adds 90-my-live.conf (/etc/init.d/S31containers).
[containers]
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

# Rootless containers get the network from slirp4netns (podman 5 would take
# pasta, which needs newer kernel headers than the toolchain has).
[network]
default_rootless_network_cmd = "slirp4netns"
