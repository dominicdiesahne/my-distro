# Podman's storage on my-distro (package my-podman-conf).
#
# root's containers are in graphroot, every user's own in
# ~/.local/share/containers/storage (rootless). Both use the kernel's
# overlayfs: it works inside a user namespace too (Linux 5.13 and newer), so
# no fuse-overlayfs is needed. Changing the driver later needs
# "podman system reset" (it deletes all images and containers).
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mountopt = "nodev"
