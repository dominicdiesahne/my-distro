# Boot menu of the ISO. Buildroot replaces __KERNEL_PATH__ and __INITRD_PATH__.
# rdinit= picks the program the kernel runs first from the initrd: our init.
set default="0"
set timeout="5"

# Start Linux in a graphics mode from the firmware (VESA/UEFI GOP). Linux draws
# on it until a real graphics driver loads, and X can use it if the VM's
# graphics card has no driver at all.
insmod all_video
set gfxpayload="1280x800,1024x768,auto"

menuentry "my-distro" {
	linux __KERNEL_PATH__ rdinit=/sbin/my-init console=tty1 quiet
	initrd __INITRD_PATH__
}

# nomodeset turns off the graphics card drivers: only the firmware's graphics
# mode is used, which works on almost any (virtual) machine.
menuentry "my-distro (safe graphics)" {
	linux __KERNEL_PATH__ rdinit=/sbin/my-init console=tty1 nomodeset
	initrd __INITRD_PATH__
}

# Also sends the boot messages to the first serial port (COM1), so they can be
# saved to a file, e.g. VirtualBox: Settings > Serial Ports > Raw File.
menuentry "my-distro (show boot messages)" {
	linux __KERNEL_PATH__ rdinit=/sbin/my-init console=ttyS0,115200 console=tty1
	initrd __INITRD_PATH__
}
