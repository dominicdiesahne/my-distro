# Built into the BIOS GRUB image of the ISO (Makefile, which leaves these
# comment lines out: GRUB's rescue parser runs this, one command per line).
# The ISO can start from a CD (where GRUB's disk is called "cd") or from a
# USB stick (a hard disk, "hd0"). GRUB starts on the disk it was started
# from; the search makes sure the boot menu is this ISO's own: @ISO_UUID@ is
# the ID the Makefile gives each ISO (0.9.9; before, it looked for any disk
# with /boot/bzImage, which could be an installed my-distro). If it finds
# nothing, $root stays the disk GRUB was started from.
search --no-floppy --fs-uuid --set=root @ISO_UUID@
set prefix=($root)/boot/grub
