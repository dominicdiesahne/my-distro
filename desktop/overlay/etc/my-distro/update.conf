# System updates (my-update). Updates keep this file.

# Where to look for the newest release: GitHub's "latest release" page of
# the my-distro repository. Updates must be signed with the key that
# /etc/my-distro/update-key.pem belongs to.
url = https://api.github.com/repos/dominicdiesahne/my-distro/releases/latest

# How often to look, in hours (also once at every login)
check_every_hours = 6
