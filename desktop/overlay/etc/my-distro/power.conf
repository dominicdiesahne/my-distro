# What closing a laptop's lid does (my-lidd, started by /etc/init.d/S46power):
#   suspend = lock the screen and sleep (opening the lid wakes it up)
#   lock    = only lock the screen
#   nothing = keep running
# After a change: /etc/init.d/S46power restart (as root). Kept by updates.
lid = suspend

# How fast the CPU runs:
#   balanced    = as fast as the work needs (schedutil / intel_pstate)
#   performance = always full speed (more heat and battery use)
#   powersave   = slower, for a longer battery life
# Check it: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
cpu = balanced
