# Programs from the Software app (my-pkg). Updates keep this file.

# Where the package list (my-pkg-index.json, .sig) and the packages are:
# the GitHub release of the installed version; {version} becomes e.g. 0.9.5.
# The list must be signed with the key that /etc/my-distro/update-key.pem
# belongs to. To test your own packages: python3 -m http.server in
# out/packages and url = http://10.0.2.2:8000/ (QEMU's address of the host).
url = https://github.com/dominicdiesahne/my-distro/releases/download/v{version}/
