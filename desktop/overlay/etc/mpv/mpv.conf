# mpv, the media player of my-distro. Your own settings: ~/.config/mpv/mpv.conf
#
# mpv draws with plain X11: in virtual machines 3D runs on the CPU
# (llvmpipe), where scaling in software (FFmpeg) is faster than OpenGL.
vo=x11
# Decoding with the graphics chip when it can (0.9.7: VA-API on Intel and
# AMD; "copy": the pictures come back for the X11 output). Otherwise, and
# for formats the chip doesn't know, on the CPU as before.
hwdec=auto-copy-safe
# Sound through PipeWire (0.9.7), or straight to ALSA without it
ao=pipewire,alsa
# Stay open at the end, and remember where you stopped
keep-open=yes
save-position-on-quit=yes
# Fit big videos onto the screen
autofit-larger=90%x90%
