# mpv, the media player of my-distro. Your own settings: ~/.config/mpv/mpv.conf
#
# my-distro has no 3D graphics drivers (Mesa's software renderer only), so
# mpv draws with plain X11: scaling in software (FFmpeg) is faster than
# OpenGL done by the CPU.
vo=x11
ao=alsa
# Stay open at the end, and remember where you stopped
keep-open=yes
save-position-on-quit=yes
# Fit big videos onto the screen
autofit-larger=90%x90%
