#!/usr/sbin/nft -f
# The firewall of my-distro (loaded at boot by /etc/init.d/S35firewall).
#
# Everything that comes in from the network is dropped, unless it is the
# answer to something this computer started (web pages, updates, DNS, ...).
# Going out is always allowed. So programs here can use the internet, but
# nobody can connect to a program on this computer from outside.
#
# This file is replaced by system updates. Your own rules go into
# /etc/nftables.d/NAME.nft (kept by updates), for example to allow SSH:
#     add rule inet my-firewall input tcp dport 22 accept
# Then: /etc/init.d/S35firewall restart (as root). See the rules: nft list ruleset

flush ruleset

table inet my-firewall {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept                               # this computer to itself
		ct state established,related accept        # answers to our connections
		ct state invalid drop

		# IPv6 doesn't work without ICMPv6 (finding the router and neighbours)
		meta l4proto ipv6-icmp accept
		# ping, and the error messages that keep connections working
		icmp type { echo-request, destination-unreachable, time-exceeded } accept

		# Getting an IP address (DHCP for IPv4 and IPv6)
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# Finding printers and scanners in the network (Avahi, mDNS): they
		# answer "who is there?" to everyone at once, on the mDNS multicast
		# address. Only those packets get in, and Avahi announces nothing
		# about this computer (/etc/avahi/avahi-daemon.conf).
		ip daddr 224.0.0.251 udp sport 5353 udp dport 5353 accept
		ip6 daddr ff02::fb udp sport 5353 udp dport 5353 accept
	}

	chain forward {
		# This computer is not a router
		type filter hook forward priority filter; policy drop;
	}
}

include "/etc/nftables.d/*.nft"
