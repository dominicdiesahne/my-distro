#
# auditd settings of my-distro (man auditd.conf). The log stays small: at
# most 3 files of 4 MB in /var/lib/audit (the oldest is deleted), and it
# only notes what /etc/audit/rules.d/my-distro.rules asks for.
#
local_events = yes
write_logs = yes
log_file = /var/lib/audit/audit.log
log_group = root
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 50
max_log_file = 4
num_logs = 3
max_log_file_action = ROTATE
priority_boost = 4
name_format = NONE
space_left = 75
space_left_action = SYSLOG
admin_space_left = 50
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SYSLOG
tcp_listen_queue = 5
tcp_max_per_addr = 1
tcp_client_max_idle = 0
transport = TCP
distribute_network = no
q_depth = 2000
overflow_action = SYSLOG
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2
