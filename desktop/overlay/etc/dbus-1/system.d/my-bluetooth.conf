<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Members of the group netdev (every user the setup makes, like for
     Wi-Fi) may use Bluetooth: switch it on and off, search, pair and
     connect (the Bluetooth window, bluetoothctl). bluetoothd's own file
     (bluetooth.conf) only lets root do that. -->
<busconfig>
  <policy group="netdev">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
