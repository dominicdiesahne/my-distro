# Avahi (mDNS / DNS-SD) on my-distro: finds printers and scanners in the
# network for the Printers window and CUPS, and resolves NAME.local
# addresses. It only looks: this computer announces nothing about itself.
# The firewall (/etc/nftables.conf) lets in only the answers to that
# (multicast to port 5353).

[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=yes
disable-user-service-publishing=yes
publish-addresses=no
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no

[rlimits]
