# Kernel settings of my-distro, applied at every start (/etc/init.d/S02sysctl).
# Check one: sysctl kernel.yama.ptrace_scope

# Crash reports: the kernel hands the memory image of a crashed program to
# /usr/lib/my-distro/crash (PID, user, signal, time, name), which writes a
# report for the System logs app and shows a notification
kernel.core_pattern = |/usr/lib/my-distro/crash %P %u %s %t %e

# --- Hardening (nothing that a normal desktop needs is switched off) ---
# Programs may only debug (ptrace) their own children: malware running as
# you can't read the memory of your browser. gdb ./program and strace
# program work; attaching to a running one (gdb -p, strace -p) needs sudo.
kernel.yama.ptrace_scope = 1
# Kernel addresses are hidden from normal users (they help exploits)
kernel.kptr_restrict = 1
# Only root may profile the whole system with perf (perf for your own
# programs still works: perf record ./program)
kernel.perf_event_paranoid = 2
# Links and FIFOs in shared folders like /tmp can't be used to trick
# programs of other users into opening the wrong file
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
# setuid programs never leave a memory image anyone could read
fs.suid_dumpable = 0
# Network: no redirects or source routes from others, log impossible addresses
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
# (loose: packets must come in on some route back to their sender; strict
# checking would break the VPN's "all traffic" mode)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.tcp_syncookies = 1
