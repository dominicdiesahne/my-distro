# my-distro (1.4.0): the PulseAudio socket for programs without the
# microphone permission. my-run puts pulse/native-play into their sandbox
# as pulse/native. Its clients get pipewire.client.access = "my-play"
# (the client can't change it: desktop/patches/pipewire), and WirePlumber
# lets them play sound and nothing else (scripts/client/my-play-only.lua),
# as for clients of pipewire-0-play.
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:native-play", client.access = "my-play" }
    ]
}
