# my-distro (1.3.0): a third socket for programs without the microphone
# permission. my-run gives them only this one; every client of it gets
# pipewire.access = "my-play" (a client can't change that property), and
# WirePlumber lets those clients play sound and nothing else
# (/usr/share/wireplumber/scripts/client/my-play-only.lua).
# The first two are PipeWire's default sockets.
module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" }
        { name = "pipewire-0-manager" }
        { name = "pipewire-0-play" props = { pipewire.access = "my-play" } }
    ]
}
