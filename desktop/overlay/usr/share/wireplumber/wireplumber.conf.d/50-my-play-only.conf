# my-distro (1.3.0): programs without the microphone permission may only
# play sound (see scripts/client/my-play-only.lua and my-run).
# A profile loads only its required features and what they require or
# want, so the required virtual component below wants the script: wanted,
# not required, so if the script ever fails, the rest of the sound keeps
# working, and those programs get no access at all (a PipeWire client
# starts with no permissions), i.e. no sound, as before 1.3.0.
wireplumber.components = [
  {
    name = client/my-play-only.lua, type = script/lua
    provides = script.client.my-play-only
    requires = [ support.standard-event-source ]
  }
  {
    type = virtual, provides = custom.my-play-only
    wants = [ script.client.my-play-only ]
  }
]

wireplumber.profiles = {
  main = {
    custom.my-play-only = required
  }
}
