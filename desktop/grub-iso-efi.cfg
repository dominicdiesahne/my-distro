# EFI/BOOT/grub.cfg of the ISO (0.9.9). The Makefile puts it into the ISO's
# FAT image (where UEFI GRUB starts from a USB stick) and into the ISO 9660
# filesystem (where it starts from a CD), with @ISO_UUID@ replaced by this
# ISO's own ID. my-distro's UEFI GRUB reads it first
# (desktop/grub-efi-embedded.cfg): it finds this ISO, not an installed
# my-distro on another disk, and shows the ISO's boot menu.
search --no-floppy --fs-uuid --set=root @ISO_UUID@
set prefix=($root)/boot/grub
configfile $prefix/grub.cfg
