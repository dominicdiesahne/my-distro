# Built into the UEFI GRUB image (grubx64.efi, desktop/post-build.sh; shim
# starts it). An installed system has a grub.cfg next to it on the EFI
# partition (written by my-install) that says where the boot menu is. The
# ISO has none: there GRUB starts from a small FAT image inside the ISO,
# so find the ISO itself and load its /boot/grub/grub.cfg.
if [ -f "$cmdpath/grub.cfg" ]; then
	source "$cmdpath/grub.cfg"
else
	search --no-floppy --file --set=root /boot/bzImage
	set prefix=($root)/boot/grub
fi
