# Built into the UEFI GRUB image (grubx64.efi, desktop/post-build.sh; shim
# starts it).
#
# GRUB runs this with its small rescue parser, before its script language
# is there: one command per line, every line runs, no "if" (post-build.sh
# leaves these comment lines out).
#
# 0.9.9: GRUB starts the my-distro it was started from, also when a second
# disk with my-distro is attached (an installed disk and a USB stick or the
# ISO). $cmdpath is the folder GRUB was started from: EFI/BOOT on this
# disk's EFI partition, or on the ISO's (the FAT image inside it, and the
# ISO 9660 filesystem itself when it starts from a CD). A grub.cfg there
# (written by my-install, my-secureboot prepare or the Makefile for the
# ISO) finds that installation's own filesystem by its unique ID, and
# "configfile" shows its boot menu and starts the system from it: this
# file never gets past the next line then.
source $cmdpath/grub.cfg
# Only without such a grub.cfg (or when someone leaves the boot menu with
# Esc): the first disk that has a kernel. Before 0.9.9 these lines also ran
# after the grub.cfg and could pick another disk.
search --no-floppy --file --set=root /boot/bzImage
set prefix=($root)/boot/grub
